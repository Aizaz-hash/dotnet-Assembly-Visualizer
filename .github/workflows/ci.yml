name: CI

on:
  pull_request:
    branches: [main, v2, v3]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # builds the sample assemblies (samples/) first, then runs both kinds of tests; Unit uses fakes, Integration analyses the real samples
      - run: dotnet test tests/DotNetVisualizer.Web.Tests -c Release --filter "FullyQualifiedName~Tests.Unit"
      - run: dotnet test tests/DotNetVisualizer.Web.Tests -c Release --filter "FullyQualifiedName~Tests.Integration"
      # pure UI logic (depth model, graph layout, double-click handling, loader stages)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/js/*.test.js

  # the whole interface in a real browser (tests/ui): starts the app, drives headless Chrome through the DevTools protocol, no extra packages
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # builds the app and the sample assemblies (they are copied next to the test project)
      - run: dotnet build tests/DotNetVisualizer.Web.Tests -c Release
      - run: google-chrome --version
      - run: node --test tests/ui/*.test.mjs
        env:
          UI_TEST_CONFIG: Release

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dotnet-visualizer:ci .

      - name: Run container
        run: docker run -d --rm -p 8080:8080 --name dav-ci dotnet-visualizer:ci

      - name: Wait for homepage to return 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "Homepage returned 200"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying..."
            sleep 2
          done
          echo "Homepage did not return 200 in time"
          docker logs dav-ci
          exit 1

      - name: Teardown
        if: always()
        run: docker stop dav-ci || true
