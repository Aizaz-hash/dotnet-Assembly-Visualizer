name: CI

on:
  pull_request:
    branches: [main, v2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # unit tests (CVSS, version ranges, scanner logic with a fake database) and API tests; no network access needed
      - run: dotnet test tests/DotNetVisualizer.Web.Tests -c Release
      # pure UI logic (depth model, graph layout, double-click handling, loader stages)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/js/*.test.js

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dotnet-visualizer:ci .

      - name: Run container
        run: docker run -d --rm -p 8080:8080 --name dav-ci dotnet-visualizer:ci

      - name: Wait for homepage to return 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "Homepage returned 200"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying..."
            sleep 2
          done
          echo "Homepage did not return 200 in time"
          docker logs dav-ci
          exit 1

      - name: Teardown
        if: always()
        run: docker stop dav-ci || true
