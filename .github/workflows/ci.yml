name: CI

on:
  pull_request:
    branches: [main, v2, v3]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # builds the sample assemblies (samples/) first, then runs both kinds of tests; Unit uses fakes, Integration analyses the real samples
      - run: dotnet test tests/DotNetVisualizer.Web.Tests -c Release --filter "FullyQualifiedName~Tests.Unit"
      - run: dotnet test tests/DotNetVisualizer.Web.Tests -c Release --filter "FullyQualifiedName~Tests.Integration"
      # pure UI logic (depth model, graph layout, double-click handling, loader stages)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/js/*.test.js

  # the whole interface in a real browser (tests/ui): starts the app, drives headless Chrome through the DevTools protocol, no extra packages
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # builds the app and the sample assemblies (they are copied next to the test project)
      - run: dotnet build tests/DotNetVisualizer.Web.Tests -c Release
      - run: google-chrome --version
      - run: node --test tests/ui/*.test.mjs
        env:
          UI_TEST_CONFIG: Release

  # the Dav PowerShell module (docs/dav-module.md): builds the module folder, then runs the end-to-end checks on the real process exit codes
  # in PowerShell 7 on three operating systems and in Windows PowerShell 5.1
  module-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # builds the sample assemblies the checks run on
      - run: dotnet build tests/DotNetVisualizer.Web.Tests -c Release
      - name: Build the module
        shell: pwsh
        run: ./scripts/build-module.ps1 -Output artifacts
      - name: End-to-end checks in PowerShell 7
        shell: pwsh
        run: ./tests/ps/Dav.Tests.ps1 -Module artifacts/Dav -Samples tests/DotNetVisualizer.Web.Tests/bin/Release/net8.0/samples
      - name: End-to-end checks in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/ps/Dav.Tests.ps1 -Module artifacts/Dav -Samples tests/DotNetVisualizer.Web.Tests/bin/Release/net8.0/samples
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dav-module
          path: |
            artifacts/Dav-*.zip
            artifacts/Dav.*.nupkg
            artifacts/SHA256SUMS

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dotnet-visualizer:ci .

      - name: Run container
        run: docker run -d --rm -p 8080:8080 --name dav-ci dotnet-visualizer:ci

      - name: Wait for homepage to return 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "Homepage returned 200"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying..."
            sleep 2
          done
          echo "Homepage did not return 200 in time"
          docker logs dav-ci
          exit 1

      - name: Teardown
        if: always()
        run: docker stop dav-ci || true
