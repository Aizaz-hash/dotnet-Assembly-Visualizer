name: 'dotnet Assembly Visualizer - dependency scan'
description: 'Scan a .NET assembly''s dependencies (levels 1-4) for known vulnerabilities; writes SARIF and a CycloneDX SBOM and fails the build on Critical/High findings.'
author: 'Aizaz-hash'

inputs:
  assembly:
    description: 'Path of the .dll or .exe to scan (relative to the workspace).'
    required: true
  manifest:
    description: 'Optional .deps.json, project.assets.json or packages.lock.json for exact versions (defaults to <assembly>.deps.json next to it).'
    required: false
    default: ''
  fail-on:
    description: 'critical | high | medium | low | none - fail the step when a finding is at or above this severity.'
    required: false
    default: 'high'
  sarif:
    description: 'Where to write the SARIF file (upload it with github/codeql-action/upload-sarif).'
    required: false
    default: 'dependency-scan.sarif'
  sbom:
    description: 'Where to write the CycloneDX SBOM.'
    required: false
    default: 'sbom.cdx.json'
  allow-incomplete:
    description: 'Set to true to not fail when the scan could not check everything (for example no network).'
    required: false
    default: 'false'
  image:
    description: 'Container image to run.'
    required: false
    default: 'ghcr.io/aizaz-hash/dotnet-visualizer-web:latest'

runs:
  using: 'composite'
  steps:
    - name: Scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ASSEMBLY: ${{ inputs.assembly }}
        MANIFEST: ${{ inputs.manifest }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF: ${{ inputs.sarif }}
        SBOM: ${{ inputs.sbom }}
        ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
      run: |
        args=("scan" "/work/${ASSEMBLY}" "--fail-on" "${FAIL_ON}" "--sarif" "/work/${SARIF}" "--sbom" "/work/${SBOM}")
        if [ -n "${MANIFEST}" ]; then args+=("--manifest" "/work/${MANIFEST}"); fi
        if [ "${ALLOW_INCOMPLETE}" = "true" ]; then args+=("--allow-incomplete"); fi
        # the container runs as a non-root user: make the workspace writable for the output files
        docker run --rm --user "$(id -u):$(id -g)" -v "${GITHUB_WORKSPACE}:/work" "${IMAGE}" "${args[@]}"
